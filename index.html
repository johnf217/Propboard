<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1B2D">
<title>Prop Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1B2D; --surface:#17263D; --surface2:#1F3150; --line:#2A3F62;
  --text:#EEF2F7; --muted:#8FA3BF; --faint:#5E7394;
  --over:#3DDC97; --under:#FF6B6B; --push:#8FA3BF; --post:#FFD166;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--post);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
.press{transition:transform .14s var(--ease), background-color .2s}
.press:active{transform:scale(.97)}

/* sticky header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:0 -16px;padding:10px 16px 10px;
  background:rgba(15,27,45,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.title{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 10px}
.title h1{font:700 28px/1 var(--cond);margin:0;letter-spacing:.2px;white-space:nowrap}
.title span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:12px}

/* segmented with sliding pill */
.seg{position:relative;display:flex;background:var(--surface);border-radius:11px;padding:3px}
.seg button{position:relative;z-index:1;flex:1;border:0;background:none;padding:8px 0;font-size:14px;font-weight:600;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--text)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--surface2);box-shadow:0 1px 0 rgba(255,255,255,.04) inset;transition:transform .35s var(--ease),width .35s var(--ease)}
.seg.small button{padding:6px 0;font-size:13px}

.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;color:var(--muted);transition:background-color .25s,color .25s,border-color .25s,transform .14s var(--ease)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--post);margin-left:6px;vertical-align:middle}
.controls{display:flex;gap:10px;align-items:center;margin-top:10px}
.controls .seg{flex:1}
.find{flex:0 0 38%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px 11px;font-size:14px;min-width:0}
.find::placeholder{color:var(--faint)}

/* avatar */
.av{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:700 14px/1 var(--cond);letter-spacing:.3px;color:#fff;background:var(--c,#3A4E70);box-shadow:inset 0 -10px 16px rgba(0,0,0,.18)}

/* form strip */
.strip{display:block;flex:none}
.strip rect{transform-box:fill-box;transform-origin:bottom}
.anim .strip rect{animation:grow .45s var(--ease) both}

/* top plays */
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.play{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:10px 12px}
.play:disabled{opacity:.55;cursor:default}
.rank{flex:none;width:18px;font:600 15px var(--cond);color:var(--faint);text-align:center}
.who{flex:1;min-width:0}
.who b{display:block;font:600 19px/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .l2{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--muted);white-space:nowrap}
.who .l2 em{font-style:normal;color:var(--post);font:700 16px/1 var(--cond)}
.metric{flex:none;min-width:66px;text-align:right}
.metric b{display:block;font:700 22px/1 var(--cond)}
.metric small{display:block;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.g{color:var(--over)} .r{color:var(--under)} .y{color:var(--post)}

/* by game */
.sec{background:var(--surface);border-radius:18px;margin-top:12px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:14px 16px;text-align:left}
.sec-h .mu{flex:1;font:700 22px/1 var(--cond)}
.sec-h .mu span{color:var(--faint);font-weight:500;margin:0 6px}
.sec-h small{color:var(--muted);font-size:13px;text-align:right}
.chev{flex:none;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .3s var(--ease)}
.sec.closed .chev{transform:rotate(-45deg)}
.sec-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s var(--ease)}
.sec.closed .sec-b{grid-template-rows:0fr}
.sec-b>div{overflow:hidden}
.pc{border-top:1px solid var(--line);padding:12px 16px}
.pc-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pc-h b{font:600 19px/1.1 var(--cond)}
.pc-h small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.pr{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:4px 12px;width:100%;border:0;background:none;border-radius:12px;padding:8px 8px;margin:0 -8px;text-align:left;width:calc(100% + 16px)}
.pr:active{background:var(--surface2)}
.pr:disabled{opacity:.55}
.pr .mk{font-size:14px;color:var(--muted)}
.pr .mk em{font:700 20px var(--cond);font-style:normal;color:var(--post);margin-left:6px}
.pr .lean{font:600 15px var(--cond);min-width:62px;text-align:right}
.pr .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.g{background:rgba(61,220,151,.14);color:var(--over)}
.tag.y{background:rgba(255,209,102,.14);color:var(--post)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty button{margin-top:14px;border:0;border-radius:12px;background:var(--text);color:var(--bg);padding:10px 16px;font-weight:600}

/* player */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-weight:600;padding:6px 0}
.back::before{content:"";width:9px;height:9px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}
.hero{position:relative;display:flex;gap:14px;align-items:center;padding:14px 0 6px}
.hero .av{width:56px;height:56px;border-radius:16px;font-size:18px}
.hero h1{font:700 34px/1 var(--cond);margin:0}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.hero p span{display:block;color:var(--faint);font-size:13px}
.search{position:relative;margin-top:10px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:16px}
.search input::placeholder{color:var(--faint)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface2);border:1px solid var(--line);border-radius:14px;max-height:320px;overflow:auto;z-index:20;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.results.open{opacity:1;transform:none;pointer-events:auto}
.results button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;text-align:left}
.results button:last-child{border-bottom:0}
.results button .av{width:30px;height:30px;border-radius:9px;font-size:12px}
.results small{margin-left:auto;color:var(--muted)}
.deck{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.panel{background:var(--surface);border-radius:16px;padding:12px 14px}
.panel .k{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.stepper button{width:38px;height:38px;border-radius:11px;border:0;background:var(--surface2);font-size:22px;line-height:1;transition:transform .14s var(--ease),opacity .2s}
.stepper button:active{transform:scale(.88)}
.stepper button:disabled{opacity:.3}
.stepper input{width:84px;background:none;border:0;text-align:center;font:700 34px/1 var(--cond);color:var(--post)}
.hit{font:700 34px/1.05 var(--cond);margin-top:4px;transition:color .3s}
.hit small{font:500 15px var(--body);color:var(--muted);margin-left:6px}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:8px}
.meter div{height:100%;background:currentColor;border-radius:3px;transition:width .45s var(--ease)}
.books{background:var(--surface);border-radius:16px;margin-bottom:14px;overflow:hidden}
.books .bh{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.books button{display:grid;grid-template-columns:1fr 58px 62px 62px;width:100%;border:0;background:none;padding:10px 14px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;transition:background-color .25s}
.books button+button{border-top:1px solid var(--line)}
.books button span:first-child{text-align:left;font-weight:600}
.books button.on{background:var(--surface2)}
.books button.on span:nth-child(2){color:var(--post);font-weight:700}
.opp{display:flex;justify-content:flex-end;margin:10px 0 8px}
.opp select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.chart{position:relative;background:var(--surface);border-radius:16px;padding:12px 0 6px;margin-bottom:12px}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chart-scroll::-webkit-scrollbar{display:none}
.chart svg{display:block}
.bar{transform-box:fill-box;transform-origin:bottom;transition:fill .3s}
.anim .bar{animation:grow .5s var(--ease) both}
.pline{transition:transform .35s var(--ease)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.sum div{background:var(--surface);border-radius:12px;padding:8px 10px}
.sum .k{font-size:12px;color:var(--muted)}
.sum .v{font:600 22px/1.1 var(--cond)}
h2{font:600 20px var(--cond);margin:0 0 8px}
.table{overflow-x:auto;background:var(--surface);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
tr+tr td{border-top:1px solid var(--line)}
td.o{color:var(--over);font-weight:600} td.u{color:var(--under);font-weight:600} td.p{color:var(--push)}

@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes vtOut{to{opacity:0;transform:translateX(-18%)}}
@keyframes vtIn{from{opacity:0;transform:translateX(28%)}}
@keyframes vtOutB{to{opacity:0;transform:translateX(18%)}}
@keyframes vtInB{from{opacity:0;transform:translateX(-28%)}}
::view-transition-old(root){animation:vtOut .26s cubic-bezier(.4,0,.2,1) both}
::view-transition-new(root){animation:vtIn .34s var(--ease) both}
html[data-dir="back"]::view-transition-old(root){animation-name:vtOutB}
html[data-dir="back"]::view-transition-new(root){animation-name:vtInB}
@media (prefers-reduced-motion:reduce){*,*::before,*::after,::view-transition-old(root),::view-transition-new(root){animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- BOARD -->
  <section id="board" hidden>
    <div class="top" id="boardTop">
      <div class="title"><h1>Prop Board</h1><span id="updated"></span></div>
      <div class="seg" id="mode" role="group" aria-label="Board layout">
        <button data-v="top">Top plays</button>
        <button data-v="games">By game</button>
      </div>
      <div class="chips" id="bMarkets" role="group" aria-label="Market"></div>
      <div class="controls">
        <div class="seg small" id="sort" role="group" aria-label="Rank by">
          <button data-v="edge">Edge</button>
          <button data-v="trend">Trend</button>
          <button data-v="gap">Line gap</button>
        </div>
        <input id="find" class="find" type="search" placeholder="Find player" autocomplete="off" aria-label="Find a player on the board">
      </div>
    </div>
    <div id="boardBody"></div>
  </section>

  <!-- PLAYER -->
  <section id="playerView" hidden>
    <div class="top" id="playerTop">
      <button class="back press" id="backBtn">Board</button>
      <div class="search">
        <input id="q" type="search" placeholder="Search any player" autocomplete="off" aria-label="Search players">
        <div id="results" class="results" role="listbox"></div>
      </div>
    </div>
    <div class="hero">
      <div class="av" id="pav"></div>
      <div><h1 id="pname">—</h1><p id="pmeta"></p></div>
    </div>
    <div id="markets" class="chips" role="group" aria-label="Prop market"></div>
    <div class="deck">
      <div class="panel">
        <div class="k">Line</div>
        <div class="stepper">
          <button id="minus" aria-label="Lower line">−</button>
          <input id="line" inputmode="decimal" aria-label="Prop line">
          <button id="plus" aria-label="Raise line">+</button>
        </div>
      </div>
      <div class="panel" id="hitPanel">
        <div class="k">Went over</div>
        <div class="hit" id="hit">—</div>
        <div class="meter"><div id="meter" style="width:0"></div></div>
      </div>
    </div>
    <div id="books" class="books" hidden></div>
    <div id="windows" class="seg small" role="group" aria-label="Games shown">
      <button data-v="l5">L5</button><button data-v="l10">L10</button><button data-v="season">Season</button><button data-v="all">All</button>
    </div>
    <div class="opp"><select id="opp" aria-label="Filter by opponent"></select></div>
    <div class="chart"><div class="chart-scroll" id="chartScroll"><div id="chart"></div></div></div>
    <div class="sum">
      <div><div class="k">Average</div><div class="v" id="avg">—</div></div>
      <div><div class="k">Median</div><div class="v" id="med">—</div></div>
      <div><div class="k">High</div><div class="v" id="hi">—</div></div>
      <div><div class="k">Low</div><div class="v" id="lo">—</div></div>
    </div>
    <h2>Game log</h2>
    <div class="table"><table id="log"></table></div>
  </section>
</div>

<script>
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- markets ---------- */
const MARKETS = {
  pass_yds:{label:"Pass yds",   get:g=>g.py},
  pass_td: {label:"Pass TDs",   get:g=>g.ptd},
  pass_att:{label:"Pass att",   get:g=>g.pa},
  rush_yds:{label:"Rush yds",   get:g=>g.ry},
  carries: {label:"Carries",    get:g=>g.ca},
  rec:     {label:"Receptions", get:g=>g.rec},
  rec_yds: {label:"Rec yds",    get:g=>g.rey},
  rr_yds:  {label:"Rush + rec", get:g=>g.ry+g.rey},
  atd:     {label:"Anytime TD", get:g=>g.rtd+g.retd, fixed:0.5},
};
const BY_POS = {
  QB:["pass_yds","pass_td","pass_att","rush_yds","atd"],
  RB:["rush_yds","carries","rr_yds","rec","rec_yds","atd"],
  WR:["rec_yds","rec","rr_yds","atd"],
  TE:["rec_yds","rec","atd"],
};
const TEAM_COLOR = {ARI:"#97233F",ATL:"#A71930",BAL:"#4B2E9A",BUF:"#1E5BC6",CAR:"#0085CA",CHI:"#C83803",CIN:"#FB4F14",CLE:"#FF3C00",
  DAL:"#2F6DB5",DEN:"#FB4F14",DET:"#0076B6",GB:"#2E6B3F",HOU:"#A71930",IND:"#2A5CAA",JAX:"#006778",KC:"#E31837",LV:"#6B7278",
  LAC:"#0080C6",LA:"#2A58C9",MIA:"#008E97",MIN:"#6A3FA8",NE:"#C60C30",NO:"#A08A5B",NYG:"#1F43A8",NYJ:"#1B8A5A",PHI:"#0E7C86",
  PIT:"#C99A06",SF:"#AA0000",SEA:"#3F8A1F",TB:"#D50A0A",TEN:"#4B92DB",WAS:"#8C2F43"};

/* ---------- state ---------- */
let DATA=null, PROPS=null, player=null, chartState=null, boardScroll=0;
const byId = new Map(), propIdx = new Map();
const st  = {market:null, line:null, win:"l10", opp:""};
const bst = {mode:"top", market:"", sort:"edge", find:"", closed:new Set()};
const $ = id => document.getElementById(id);
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
Object.assign(bst, store.get("pb_bst") || {}, {closed:new Set(), find:""});

/* ---------- demo data (fictional players) ---------- */
function demoData(){
  let seed = 7; const r = () => (seed = (seed*16807)%2147483647)/2147483647;
  const n = (m,sd) => Math.max(0, Math.round(m + sd*((r()+r()+r()-1.5)*1.4)));
  const teams = ["BUF","MIA","NYJ","NE","KC","LV","DEN","LAC","DAL","PHI","NYG","WAS","GB","CHI","DET","MIN"];
  const defs = [["Demo QB Marcus Hale","QB","KC"],["Demo RB Tre Okafor","RB","DET"],["Demo WR Jalen Pryce","WR","MIA"],
    ["Demo WR Cole Brandt","WR","GB"],["Demo TE Nate Varga","TE","PHI"],["Demo RB Dom Reyes","RB","DAL"]];
  const players = defs.map(([name,pos,team],i)=>{
    const logs=[];
    [[2025,17],[2026,3]].forEach(([s,weeks])=>{
      for(let w=1; w<=weeks; w++){
        if(r()<0.06) continue;
        const o = teams.filter(t=>t!==team)[Math.floor(r()*15)];
        const g={s,w,o,py:0,ptd:0,pa:0,ca:0,ry:0,rtd:0,tgt:0,rec:0,rey:0,retd:0};
        if(pos==="QB"){g.pa=n(34,6);g.py=n(262,60);g.ptd=n(1.8,1.1);g.ca=n(4,2);g.ry=n(18,14);g.rtd=r()<.12?1:0}
        if(pos==="RB"){g.ca=n(17,5);g.ry=n(78,30);g.rtd=r()<.45?1:0;g.tgt=n(4,2);g.rec=Math.min(g.tgt,n(3,1.5));g.rey=n(g.rec*7.5,8);g.retd=r()<.08?1:0}
        if(pos==="WR"){g.tgt=n(8,3);g.rec=Math.min(g.tgt,n(5.5,2));g.rey=n(g.rec*13,22);g.retd=r()<.33?1:0}
        if(pos==="TE"){g.tgt=n(6,2);g.rec=Math.min(g.tgt,n(4.5,1.8));g.rey=n(g.rec*10.5,15);g.retd=r()<.25?1:0}
        logs.push(g);
      }
    });
    return {id:"demo"+i,name,pos,team,logs};
  });
  return {season:2026, updated:"demo", demo:true, players};
}

/* ---------- helpers ---------- */
const median = a => { if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const fmt = v => v==null ? "—" : Number.isInteger(v) ? String(v) : v.toFixed(1);
const toHalf = v => Math.floor(v) + 0.5;
const result = (v,line) => v>line ? "o" : v<line ? "u" : "p";
const am = p => p==null ? "—" : p>0 ? "+"+p : "−"+Math.abs(p);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kickTime = k => new Date(k).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"});
const avatar = (team, cls="av") => `<div class="${cls}" style="--c:${TEAM_COLOR[team]||"#3A4E70"}">${esc(team||"—")}</div>`;
const book = t => ({DraftKings:"DK",FanDuel:"FD",BetMGM:"MGM",Caesars:"CZR",Bovada:"BOV",Pinnacle:"PIN",Underdog:"UD","ESPN BET":"ESPN",Fanatics:"FAN",BetRivers:"BR"}[t] || t);

function setSeg(el, value){
  let pill = el.querySelector(".pill");
  if(!pill){ pill = document.createElement("div"); pill.className="pill"; el.prepend(pill); }
  const btn = [...el.querySelectorAll("button")].find(b=>b.dataset.v===value);
  el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===btn));
  if(btn){ pill.style.width = btn.offsetWidth+"px"; pill.style.transform = `translateX(${btn.offsetLeft}px)`; }
}
function countTo(el, to, suffix){
  const from = +(el.dataset.v || 0); el.dataset.v = to;
  if(RM || from===to){ el.firstChild.textContent = to; return; }
  const t0 = performance.now(), d = 380;
  const step = t => { const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3);
    el.firstChild.textContent = Math.round(from+(to-from)*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function flip(container, renderFn){
  const first = new Map();
  container.querySelectorAll("[data-key]").forEach(el=>first.set(el.dataset.key, el.getBoundingClientRect().top));
  renderFn();
  if(RM) return;
  let i = 0;
  container.querySelectorAll("[data-key]").forEach(el=>{
    const top = el.getBoundingClientRect().top;
    if(top > innerHeight + 200) return;
    const f = first.get(el.dataset.key);
    if(f!=null){ const dy=f-top; if(Math.abs(dy)>1) el.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],{duration:420,easing:"cubic-bezier(.2,.8,.2,1)"}); }
    else el.animate([{opacity:0,transform:"translateY(10px) scale(.98)"},{opacity:1,transform:"none"}],{duration:320,delay:Math.min(i++,14)*22,easing:"cubic-bezier(.2,.8,.2,1)",fill:"backwards"});
  });
}

/* ---------- navigation ---------- */
function go(view, dir){
  const run = () => {
    if(view==="player"){ boardScroll = scrollY; }
    $("board").hidden = view!=="board"; $("playerView").hidden = view!=="player";
    store.set("pb_view", view);
    if(view==="player"){ scrollTo(0,0); renderPlayer(true); setSeg($("windows"), st.win); }
    else { renderBoard(false); setSeg($("mode"), bst.mode); setSeg($("sort"), bst.sort); scrollTo(0, boardScroll); }
  };
  if(document.startViewTransition && !RM && dir){
    document.documentElement.dataset.dir = dir;
    document.startViewTransition(run);
  } else run();
}

/* ---------- load ---------- */
async function getJSON(url){ const r = await fetch(url,{cache:"no-cache"}); if(!r.ok) throw 0; return r.json(); }
async function load(){
  try{ DATA = await getJSON("player_logs.json"); }catch(e){ DATA = demoData(); }
  try{ PROPS = await getJSON("props.json"); }catch(e){ PROPS = null; }
  DATA.players.forEach(p=>{ p.logs.sort((a,b)=>a.s-b.s||a.w-b.w); byId.set(p.id,p); });
  if(PROPS){
    PROPS.props.forEach((p,i)=>{
      p.key = (p.pid||p.name)+"|"+p.market; p.gameOf = PROPS.games.find(g=>g.label===p.game);
      if(p.pid) propIdx.set(p.pid+"|"+p.market, p);
      enrich(p);
    });
    $("updated").textContent = "Lines " + kickTime(PROPS.updated);
  } else $("updated").textContent = DATA.demo ? "Demo stats" : "";
  setupBoard();
  const last = store.get("pb_player");
  selectPlayer(byId.get(last) || DATA.players[0], null, true);
  go(store.get("pb_view")==="player" || !PROPS ? "player" : "board");
  $("backBtn").hidden = !PROPS;
}

/* L10 trend + form for a prop */
function enrich(p){
  const pl = byId.get(p.pid), m = MARKETS[p.market];
  p.pl = pl;
  if(!pl || !m){ p.form=null; return; }
  const vals = pl.logs.slice(-10).map(m.get);
  const o = vals.filter(v=>v>p.line).length, n = vals.length;
  p.form = {vals, o, n, avg: n ? vals.reduce((a,b)=>a+b,0)/n : 0};
  p.lean = o/n >= .5 ? "over" : "under";
  p.strength = n ? Math.max(o, n-o)/n : 0;
}
function strip(p, w=64, h=26){
  if(!p.form || !p.form.n) return `<svg class="strip" width="${w}" height="${h}"></svg>`;
  const v = p.form.vals, max = Math.max(...v, p.line, 1)*1.1, bw = (w - (v.length-1)*2)/Math.max(v.length,1);
  let s = `<svg class="strip" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  v.forEach((x,i)=>{ const bh = Math.max(2, h*x/max), r=result(x,p.line);
    s += `<rect x="${i*(bw+2)}" y="${h-bh}" width="${bw}" height="${bh}" rx="1.5" fill="var(--${r==="o"?"over":r==="u"?"under":"push"})" style="animation-delay:${i*25}ms"/>`; });
  const ly = h - h*p.line/max;
  return s + `<line x1="0" x2="${w}" y1="${ly}" y2="${ly}" stroke="var(--post)" stroke-width="1.5"/></svg>`;
}

/* ---------- board ---------- */
function setupBoard(){
  const mk = PROPS ? Object.keys(MARKETS).filter(k=>PROPS.props.some(p=>p.market===k)) : [];
  if(bst.market && !mk.includes(bst.market)) bst.market = "";
  $("bMarkets").innerHTML = [["","All"],...mk.map(k=>[k,MARKETS[k].label])]
    .map(([k,l])=>`<button class="chip" data-m="${k}" aria-pressed="${k===bst.market}">${l}</button>`).join("");
}
function score(p){
  if(bst.sort==="edge")  return p.value?.ev ?? -99;
  if(bst.sort==="trend") return p.form ? p.strength*100 + p.form.n/100 : -99;
  return p.gap;
}
function metric(p){
  if(bst.sort==="edge"){
    const v=p.value;
    if(!v || v.ev<=0) return `<b style="color:var(--faint)">—</b><small>no edge</small>`;
    return `<b class="g">+${v.ev}%</b><small>${v.side==="over"?"O":"U"} ${am(v.price)} ${esc(book(v.title))}</small>`;
  }
  if(bst.sort==="trend"){
    if(!p.form) return `<b style="color:var(--faint)">—</b><small>no log</small>`;
    const k = p.lean==="over" ? p.form.o : p.form.n-p.form.o;
    return `<b class="${p.lean==="over"?"g":"r"}">${k}/${p.form.n}</b><small>${p.lean==="over"?"over":"under"} L10</small>`;
  }
  const ls = p.books.map(b=>b.line);
  return `<b class="${p.gap>=1?"y":""}" ${p.gap>=1?"":'style="color:var(--faint)"'}>${fmt(p.gap)}</b><small>${fmt(Math.min(...ls))}–${fmt(Math.max(...ls))}</small>`;
}
function filtered(){
  const f = bst.find.trim().toLowerCase();
  return PROPS.props.filter(p => (!bst.market || p.market===bst.market) && (!f || p.name.toLowerCase().includes(f)));
}
function renderBoard(animate=true){
  const body = $("boardBody");
  if(!PROPS){ body.innerHTML = `<div class="empty">No prop lines yet. Run the Update prop lines workflow in GitHub, then reload.<br><button id="browse">Browse players</button></div>`;
    $("browse").onclick = () => go("player","fwd"); return; }
  const list = filtered();
  const draw = () => {
    if(!list.length){ body.innerHTML = `<div class="empty">No props match. Try another market or clear the search.</div>`; return; }
    body.innerHTML = bst.mode==="top" ? drawTop(list) : drawGames(list);
  };
  body.classList.toggle("anim", animate && !RM);
  if(animate) flip(body, draw); else draw();
}
function drawTop(list){
  const sorted = [...list].sort((a,b)=>score(b)-score(a)).slice(0,60);
  return `<div class="list">` + sorted.map((p,i)=>`
    <button class="play press" data-key="${esc(p.key)}" data-open="${esc(p.key)}" ${p.pl?"":"disabled"}>
      <span class="rank">${i+1}</span>${avatar(p.team)}
      <span class="who"><b>${esc(p.name)}</b><span class="l2"><span>${MARKETS[p.market]?.label||p.market} <em>${fmt(p.line)}</em></span>${strip(p,54,18)}</span></span>
      <span class="metric">${metric(p)}</span>
    </button>`).join("") + `</div>`;
}
function drawGames(list){
  const games = [...PROPS.games].sort((a,b)=>a.kick.localeCompare(b.kick));
  return games.map(g=>{
    const props = list.filter(p=>p.game===g.label);
    if(!props.length) return "";
    const players = new Map();
    props.forEach(p=>{ const k=p.pid||p.name; if(!players.has(k)) players.set(k,[]); players.get(k).push(p); });
    const cards = [...players.values()]
      .map(ps=>({ps: ps.sort((a,b)=>score(b)-score(a)), top: Math.max(...ps.map(score))}))
      .sort((a,b)=>b.top-a.top);
    const [away, home] = g.label.split(" @ ");
    const closed = bst.closed.has(g.label);
    return `<div class="sec${closed?" closed":""}" data-key="g|${esc(g.label)}">
      <button class="sec-h" data-game="${esc(g.label)}" aria-expanded="${!closed}">
        <span class="mu">${esc(away)}<span>@</span>${esc(home)}</span>
        <small>${kickTime(g.kick)}<br>${props.length} props</small><span class="chev"></span>
      </button>
      <div class="sec-b"><div>${cards.map(({ps})=>{
        const p0 = ps[0];
        return `<div class="pc">
          <div class="pc-h">${avatar(p0.team)}<div><b>${esc(p0.name)}</b><small>${esc(p0.pos||"")}</small></div></div>
          ${ps.map(p=>{
            const o=p.bestOver, u=p.bestUnder, v=p.value;
            const lean = p.form ? `<span class="lean ${p.lean==="over"?"g":"r"}">${p.lean==="over"?"O":"U"} ${p.lean==="over"?p.form.o:p.form.n-p.form.o}/${p.form.n}</span>` : `<span class="lean" style="color:var(--faint)">—</span>`;
            const tags = [];
            if(v && v.ev>0 && p.n>=2) tags.push(`<span class="tag g">${v.side==="over"?"Over":"Under"} ${am(v.price)} ${esc(book(v.title))} +${v.ev}%</span>`);
            if(p.gap>=1) tags.push(`<span class="tag y">Books differ by ${fmt(p.gap)}</span>`);
            return `<button class="pr" data-open="${esc(p.key)}" ${p.pl?"":"disabled"}>
              <span class="mk">${MARKETS[p.market]?.label||p.market}<em>${fmt(p.line)}</em></span>${strip(p,56,22)}${lean}
              <span class="sub">${o?`<span>O ${fmt(o.line)} ${am(o.price)} ${esc(book(o.title))}</span>`:""}${u?`<span>U ${fmt(u.line)} ${am(u.price)} ${esc(book(u.title))}</span>`:""}${tags.join("")}</span>
            </button>`;}).join("")}
        </div>`;}).join("")}</div></div>
    </div>`;
  }).join("");
}
function saveBoard(){ store.set("pb_bst", {mode:bst.mode, market:bst.market, sort:bst.sort}); }
$("mode").onclick = e => { const b=e.target.closest("[data-v]"); if(!b||b.dataset.v===bst.mode) return; bst.mode=b.dataset.v; setSeg($("mode"),bst.mode); saveBoard(); renderBoard(); };
$("sort").onclick = e => { const b=e.target.closest("[data-v]"); if(!b||b.dataset.v===bst.sort) return; bst.sort=b.dataset.v; setSeg($("sort"),bst.sort); saveBoard(); renderBoard(); };
$("bMarkets").onclick = e => { const b=e.target.closest("[data-m]"); if(!b) return; bst.market=b.dataset.m;
  [...$("bMarkets").children].forEach(c=>c.setAttribute("aria-pressed", c===b)); saveBoard(); renderBoard(); };
$("find").oninput = e => { bst.find = e.target.value; renderBoard(); };
$("boardBody").onclick = e => {
  const h = e.target.closest("[data-game]");
  if(h){ const g=h.dataset.game, sec=h.parentElement;
    bst.closed.has(g) ? bst.closed.delete(g) : bst.closed.add(g);
    sec.classList.toggle("closed"); h.setAttribute("aria-expanded", !bst.closed.has(g)); return; }
  const b = e.target.closest("[data-open]"); if(!b || b.disabled) return;
  const p = PROPS.props.find(x=>x.key===b.dataset.open);
  if(p?.pl){ selectPlayer(p.pl, p.market, true); go("player","fwd"); }
};
$("backBtn").onclick = () => go("board","back");

/* ---------- player ---------- */
function games(){
  let g = player.logs;
  if(st.opp) g = g.filter(x=>x.o===st.opp);
  const cur = Math.max(...player.logs.map(x=>x.s));
  if(st.win==="l5") g = g.slice(-5);
  if(st.win==="l10") g = g.slice(-10);
  if(st.win==="season") g = g.filter(x=>x.s===cur);
  return g;
}
function selectPlayer(p, market, silent){
  if(!p) return;
  player = p; store.set("pb_player", p.id);
  const list = BY_POS[p.pos] || Object.keys(MARKETS);
  if(market && list.includes(market)) st.market = market;
  else if(!list.includes(st.market)) st.market = list.find(k=>propIdx.has(p.id+"|"+k)) || list[0];
  st.opp = "";
  $("pname").textContent = p.name;
  $("pav").outerHTML = avatar(p.team).replace('class="av"','class="av" id="pav"');
  const prop = [...propIdx.values()].find(x=>x.pid===p.id);
  $("pmeta").innerHTML = `${esc(p.pos)}, ${esc(p.team)}` + (prop ? `<span>${esc(prop.game)}, ${kickTime(prop.kick)}</span>` : "");
  $("markets").innerHTML = list.map(k=>`<button class="chip" data-m="${k}" aria-pressed="${k===st.market}">${MARKETS[k].label}${propIdx.has(p.id+"|"+k)?"<i></i>":""}</button>`).join("");
  const opps = [...new Set(p.logs.map(x=>x.o))].sort();
  $("opp").innerHTML = `<option value="">All opponents</option>` + opps.map(o=>`<option>${o}</option>`).join("");
  resetLine();
  if(!silent) renderPlayer(true);
}
function resetLine(){
  const m = MARKETS[st.market], prop = propIdx.get(player.id+"|"+st.market);
  if(m.fixed!=null){ st.line = m.fixed; return; }
  if(prop){ st.line = prop.line; return; }
  st.line = toHalf(median(player.logs.slice(-10).map(m.get)));
}
function renderPlayer(full){
  if(!player) return;
  const m = MARKETS[st.market], fixed = m.fixed!=null;
  $("line").value = fmt(st.line);
  $("line").readOnly = fixed; $("minus").disabled = fixed || st.line<=0.5; $("plus").disabled = fixed;
  $("opp").value = st.opp;
  [...$("markets").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===st.market));

  const prop = propIdx.get(player.id+"|"+st.market);
  $("books").hidden = !prop;
  if(prop){
    $("books").innerHTML = `<div class="bh"><span>Book</span><span>Tap a line to chart it</span></div>` +
      prop.books.map(b=>`<button data-l="${b.line}" class="${b.line===st.line?"on":""}"><span>${esc(b.title)}</span><span>${fmt(b.line)}</span><span>${am(b.over)}</span><span>${am(b.under)}</span></button>`).join("");
  }

  const g = games(), vals = g.map(m.get);
  if(!g.length){
    $("chart").innerHTML = `<div class="empty">No games match. Pick a wider window or another opponent.</div>`; chartState=null;
    ["avg","med","hi","lo"].forEach(id=>$(id).textContent="—");
    $("hit").innerHTML="—<small></small>"; $("meter").style.width="0"; $("log").innerHTML=""; return;
  }
  const overs = vals.filter(v=>v>st.line).length, pct = Math.round(overs/vals.length*100);
  const col = pct>=60 ? "var(--over)" : pct<=40 ? "var(--under)" : "var(--text)";
  if(!$("hit").querySelector("span")) $("hit").innerHTML = `<span>0</span>/<span></span><small></small>`;
  const [num, den] = $("hit").querySelectorAll("span");
  if(!num.firstChild) num.textContent = "0";
  countTo(num, overs); den.textContent = vals.length; $("hit").querySelector("small").textContent = pct+"%";
  $("hitPanel").style.color = col; $("hit").style.color = col; $("meter").style.width = pct+"%";
  $("avg").textContent = fmt(Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10);
  $("med").textContent = fmt(median(vals));
  $("hi").textContent = Math.max(...vals); $("lo").textContent = Math.min(...vals);

  const needFull = full || !chartState || st.line > chartState.max/1.12;
  needFull ? drawChart(g, vals) : moveLine(vals);
  drawLog(g, m);
}
function drawChart(g, vals){
  const H=220, top=24, bottom=40, pad=14, avail=$("chartScroll").clientWidth || 320;
  const bw = Math.max(20, Math.min(34, (avail - pad*2)/g.length*0.72)), gap = Math.max(8, bw*0.38);
  const W = Math.max(avail, pad*2 + g.length*(bw+gap) - gap);
  const step = g.length>1 ? Math.min(bw+gap, (W-pad*2-bw)/(g.length-1)) : 0;
  const x0 = g.length>1 ? pad : W/2 - bw/2;
  const max = Math.max(...vals, st.line, 1) * 1.12;
  const y = v => top + (H-top-bottom) * (1 - v/max);
  const base = H-bottom;
  chartState = {max, y};
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Game log bar chart">`;
  g.forEach((gm,i)=>{
    const v = vals[i], x = x0 + i*step, r = result(v,st.line);
    const h = Math.max(2, base - y(v));
    s += `<rect class="bar" x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="5" fill="var(--${r==="o"?"over":r==="u"?"under":"push"})" style="animation-delay:${i*28}ms"/>`;
    s += `<text x="${x+bw/2}" y="${base-h-7}" text-anchor="middle" fill="var(--text)" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="600" font-size="14">${v}</text>`;
    s += `<text x="${x+bw/2}" y="${base+16}" text-anchor="middle" fill="var(--muted)" font-size="11">${gm.o}</text>`;
    s += `<text x="${x+bw/2}" y="${base+30}" text-anchor="middle" fill="var(--faint)" font-size="10">W${gm.w}</text>`;
  });
  s += `<g class="pline" id="pline" style="transform:translateY(${y(st.line)}px)"><line x1="${pad/2}" x2="${W-pad/2}" y1="0" y2="0" stroke="var(--post)" stroke-width="2" stroke-dasharray="6 4"/></g></svg>`;
  $("chart").classList.toggle("anim", !RM);
  $("chart").innerHTML = s;
  $("chartScroll").scrollLeft = 1e6;
  $("chart")._vals = vals;
}
function moveLine(vals){
  $("chart").classList.remove("anim");
  $("pline").style.transform = `translateY(${chartState.y(st.line)}px)`;
  $("chart").querySelectorAll(".bar").forEach((r,i)=>{ const k=result(vals[i],st.line);
    r.setAttribute("fill", `var(--${k==="o"?"over":k==="u"?"under":"push"})`); });
}
function drawLog(g, m){
  const pos = player.pos;
  const cols = pos==="QB"
    ? [["Att",x=>x.pa],["Pass yds",x=>x.py],["TD",x=>x.ptd],["Rush",x=>x.ry]]
    : pos==="RB"
    ? [["Car",x=>x.ca],["Rush yds",x=>x.ry],["Rec",x=>x.rec],["Rec yds",x=>x.rey],["TD",x=>x.rtd+x.retd]]
    : [["Tgt",x=>x.tgt],["Rec",x=>x.rec],["Yds",x=>x.rey],["TD",x=>x.retd]];
  let h = `<tr><th>Game</th>${cols.map(c=>`<th>${c[0]}</th>`).join("")}<th>${m.label}</th></tr>`;
  [...g].reverse().forEach(x=>{
    const v = m.get(x);
    h += `<tr><td>${x.s} W${x.w} vs ${x.o}</td>${cols.map(c=>`<td>${c[1](x)}</td>`).join("")}<td class="${result(v,st.line)}">${v}</td></tr>`;
  });
  $("log").innerHTML = h;
}

/* ---------- player events ---------- */
$("markets").onclick = e => { const b=e.target.closest("[data-m]"); if(!b||b.dataset.m===st.market) return; st.market=b.dataset.m; resetLine(); renderPlayer(true); };
$("windows").onclick = e => { const b=e.target.closest("[data-v]"); if(!b||b.dataset.v===st.win) return; st.win=b.dataset.v; setSeg($("windows"),st.win); renderPlayer(true); };
$("books").onclick = e => { const b=e.target.closest("[data-l]"); if(!b || MARKETS[st.market].fixed!=null) return; st.line=+b.dataset.l; renderPlayer(false); };
$("opp").onchange = e => { st.opp=e.target.value; renderPlayer(true); };
$("minus").onclick = () => { st.line=Math.max(0.5,st.line-1); renderPlayer(false); };
$("plus").onclick  = () => { st.line+=1; renderPlayer(false); };
$("line").onchange = e => { const v=parseFloat(e.target.value); if(!isNaN(v)&&v>=0) st.line=v; renderPlayer(false); };

const q=$("q"), res=$("results");
q.oninput = () => {
  const t = q.value.trim().toLowerCase();
  if(!t){ res.classList.remove("open"); return; }
  const hits = DATA.players.filter(p=>p.name.toLowerCase().includes(t)).slice(0,25);
  res.innerHTML = hits.length
    ? hits.map(p=>`<button data-id="${p.id}" role="option">${avatar(p.team)}<span>${esc(p.name)}</span><small>${p.pos}</small></button>`).join("")
    : `<div class="empty" style="padding:14px">No player named “${esc(q.value)}”</div>`;
  res.classList.add("open");
};
res.onclick = e => { const b=e.target.closest("[data-id]"); if(!b) return;
  q.value=""; res.classList.remove("open"); q.blur();
  const run = () => { selectPlayer(byId.get(b.dataset.id)); scrollTo(0,0); };
  if(document.startViewTransition && !RM){ document.documentElement.dataset.dir="fwd"; document.startViewTransition(run); } else run(); };
document.addEventListener("click", e => { if(!e.target.closest(".search")) res.classList.remove("open"); });

/* header shadow on scroll + keep pills aligned */
addEventListener("scroll", () => document.querySelectorAll(".top").forEach(t=>t.classList.toggle("scrolled", scrollY>4)), {passive:true});
addEventListener("resize", () => { setSeg($("mode"),bst.mode); setSeg($("sort"),bst.sort); setSeg($("windows"),st.win); if(!$("playerView").hidden) renderPlayer(true); });
document.fonts?.ready.then(()=>{ setSeg($("mode"),bst.mode); setSeg($("sort"),bst.sort); setSeg($("windows"),st.win); });

load();
</script>
