<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1B2D">
<title>Prop Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1B2D; --surface:#17263D; --surface2:#1F3150; --line:#2A3F62;
  --text:#EEF2F7; --muted:#8FA3BF; --over:#3DDC97; --under:#FF6B6B; --push:#8FA3BF; --post:#FFD166;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--post);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 32px}
[hidden]{display:none!important}

.tabs{display:flex;background:var(--surface);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:9px 0;border-radius:9px;font:600 18px var(--cond);color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}

.banner{background:var(--surface2);color:var(--muted);font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
.banner b{color:var(--text);font-weight:600}

/* board */
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:14px;padding:11px 14px}
.row:disabled{cursor:default}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.r1 .nm{font:600 20px/1.1 var(--cond)}
.r1 .nm small{font:500 13px var(--body);color:var(--muted);margin-left:6px}
.r1 .mk{white-space:nowrap;color:var(--muted);font-size:14px}
.r1 .mk b{font:700 20px var(--cond);color:var(--post);margin-left:4px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px;font-size:13px;color:var(--muted)}
.r2 b{color:var(--text);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.g{background:rgba(61,220,151,.15);color:var(--over)}
.tag.r{background:rgba(255,107,107,.15);color:var(--under)}
.tag.y{background:rgba(255,209,102,.15);color:var(--post)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* player */
.search{position:relative;margin-bottom:14px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px}
.search input::placeholder{color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:320px;overflow:auto;z-index:5;display:none}
.results.open{display:block}
.results button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;text-align:left}
.results button:last-child{border-bottom:0}
.results small{color:var(--muted)}
.player{display:flex;align-items:baseline;gap:10px;margin:4px 0 12px}
.player h1{font:700 34px/1 var(--cond);margin:0}
.player span{color:var(--muted);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.deck{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.panel{background:var(--surface);border-radius:14px;padding:12px 14px}
.panel .k{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.stepper button{width:36px;height:36px;border-radius:10px;border:0;background:var(--surface2);font-size:20px;line-height:1}
.stepper button:disabled{opacity:.35}
.stepper input{width:80px;background:none;border:0;text-align:center;font:700 32px/1 var(--cond);color:var(--post)}
.hit{font:700 32px/1.1 var(--cond);margin-top:4px}
.hit small{font:500 15px var(--body);color:var(--muted);margin-left:6px}
.books{background:var(--surface);border-radius:14px;margin-bottom:14px;overflow:hidden}
.books button{display:grid;grid-template-columns:1fr 60px 64px 64px;width:100%;border:0;background:none;padding:9px 14px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.books button+button{border-top:1px solid var(--line)}
.books button span:first-child{text-align:left}
.books .hd{color:var(--muted);cursor:default}
.books .on{background:var(--surface2)}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
.opp{display:flex;justify-content:flex-end;margin-bottom:8px}
.opp select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.chart{background:var(--surface);border-radius:14px;padding:10px 0 6px;margin-bottom:12px}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart svg{display:block}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sum div{background:var(--surface);border-radius:12px;padding:8px 10px}
.sum .k{font-size:12px;color:var(--muted)}
.sum .v{font:600 22px/1.1 var(--cond)}
h2{font:600 20px var(--cond);margin:0 0 8px}
.table{overflow-x:auto;background:var(--surface);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
tr+tr td{border-top:1px solid var(--line)}
td.o{color:var(--over);font-weight:600} td.u{color:var(--under);font-weight:600} td.p{color:var(--push)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button data-v="board">Board</button>
    <button data-v="player">Player</button>
  </div>
  <div id="banner" class="banner" hidden></div>

  <!-- BOARD -->
  <section id="board" hidden>
    <div class="filters">
      <select id="bMarket" aria-label="Market"></select>
      <select id="bGame" aria-label="Game"></select>
      <select id="bSort" aria-label="Sort">
        <option value="value">Best value</option>
        <option value="gap">Line gap</option>
        <option value="hit">L10 hit rate</option>
      </select>
    </div>
    <div class="rows" id="rows"></div>
  </section>

  <!-- PLAYER -->
  <section id="playerView" hidden>
    <div class="search">
      <input id="q" type="search" placeholder="Search players" autocomplete="off" aria-label="Search players">
      <div id="results" class="results" role="listbox"></div>
    </div>
    <div class="player"><h1 id="pname">—</h1><span id="pmeta"></span></div>
    <div id="markets" class="chips" role="group" aria-label="Prop market"></div>
    <div class="deck">
      <div class="panel">
        <div class="k">Line</div>
        <div class="stepper">
          <button id="minus" aria-label="Lower line">−</button>
          <input id="line" inputmode="decimal" aria-label="Prop line">
          <button id="plus" aria-label="Raise line">+</button>
        </div>
      </div>
      <div class="panel">
        <div class="k">Hit rate (over)</div>
        <div class="hit" id="hit">—</div>
      </div>
    </div>
    <div id="books" class="books" hidden></div>
    <div id="windows" class="seg" role="group" aria-label="Games shown"></div>
    <div class="opp"><select id="opp" aria-label="Filter by opponent"></select></div>
    <div class="chart"><div class="chart-scroll" id="chartScroll"><div id="chart"></div></div></div>
    <div class="sum">
      <div><div class="k">Average</div><div class="v" id="avg">—</div></div>
      <div><div class="k">Median</div><div class="v" id="med">—</div></div>
      <div><div class="k">High</div><div class="v" id="hi">—</div></div>
      <div><div class="k">Low</div><div class="v" id="lo">—</div></div>
    </div>
    <h2>Game log</h2>
    <div class="table"><table id="log"></table></div>
  </section>
</div>

<script>
/* ---------- markets ---------- */
const MARKETS = {
  pass_yds:{label:"Pass yds",   get:g=>g.py},
  pass_td: {label:"Pass TDs",   get:g=>g.ptd},
  pass_att:{label:"Pass att",   get:g=>g.pa},
  rush_yds:{label:"Rush yds",   get:g=>g.ry},
  carries: {label:"Carries",    get:g=>g.ca},
  rec:     {label:"Receptions", get:g=>g.rec},
  rec_yds: {label:"Rec yds",    get:g=>g.rey},
  rr_yds:  {label:"Rush + rec yds", get:g=>g.ry+g.rey},
  atd:     {label:"Anytime TD", get:g=>g.rtd+g.retd, fixed:0.5},
};
const BY_POS = {
  QB:["pass_yds","pass_td","pass_att","rush_yds","atd"],
  RB:["rush_yds","carries","rr_yds","rec","rec_yds","atd"],
  WR:["rec_yds","rec","rr_yds","atd"],
  TE:["rec_yds","rec","atd"],
};
const WINDOWS = [["l5","L5"],["l10","L10"],["season","Season"],["all","All"]];

/* ---------- state ---------- */
let DATA=null, PROPS=null, player=null;
const byId = new Map(), propIdx = new Map();
const st = {market:null, line:null, win:"l10", opp:""};
const bst = {market:"", game:"", sort:"value"};
const $ = id => document.getElementById(id);
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- demo data (fictional players) ---------- */
function demoData(){
  let seed = 7; const r = () => (seed = (seed*16807)%2147483647)/2147483647;
  const n = (m,sd) => Math.max(0, Math.round(m + sd*((r()+r()+r()-1.5)*1.4)));
  const teams = ["BUF","MIA","NYJ","NE","KC","LV","DEN","LAC","DAL","PHI","NYG","WAS","GB","CHI","DET","MIN"];
  const defs = [["Demo QB Marcus Hale","QB","KC"],["Demo RB Tre Okafor","RB","DET"],["Demo WR Jalen Pryce","WR","MIA"],
    ["Demo WR Cole Brandt","WR","GB"],["Demo TE Nate Varga","TE","PHI"],["Demo RB Dom Reyes","RB","DAL"]];
  const players = defs.map(([name,pos,team],i)=>{
    const logs=[];
    [[2025,17],[2026,3]].forEach(([s,weeks])=>{
      for(let w=1; w<=weeks; w++){
        if(r()<0.06) continue;
        const o = teams.filter(t=>t!==team)[Math.floor(r()*15)];
        const g={s,w,o,py:0,ptd:0,pa:0,ca:0,ry:0,rtd:0,tgt:0,rec:0,rey:0,retd:0};
        if(pos==="QB"){g.pa=n(34,6);g.py=n(262,60);g.ptd=n(1.8,1.1);g.ca=n(4,2);g.ry=n(18,14);g.rtd=r()<.12?1:0}
        if(pos==="RB"){g.ca=n(17,5);g.ry=n(78,30);g.rtd=r()<.45?1:0;g.tgt=n(4,2);g.rec=Math.min(g.tgt,n(3,1.5));g.rey=n(g.rec*7.5,8);g.retd=r()<.08?1:0}
        if(pos==="WR"){g.tgt=n(8,3);g.rec=Math.min(g.tgt,n(5.5,2));g.rey=n(g.rec*13,22);g.retd=r()<.33?1:0}
        if(pos==="TE"){g.tgt=n(6,2);g.rec=Math.min(g.tgt,n(4.5,1.8));g.rey=n(g.rec*10.5,15);g.retd=r()<.25?1:0}
        logs.push(g);
      }
    });
    return {id:"demo"+i,name,pos,team,logs};
  });
  return {season:2026, updated:"demo", demo:true, players};
}

/* ---------- load ---------- */
async function getJSON(url){ const r = await fetch(url,{cache:"no-cache"}); if(!r.ok) throw 0; return r.json(); }
async function load(){
  try{ DATA = await getJSON("player_logs.json"); }catch(e){ DATA = demoData(); }
  try{ PROPS = await getJSON("props.json"); }catch(e){ PROPS = null; }
  DATA.players.forEach(p=>{ p.logs.sort((a,b)=>a.s-b.s||a.w-b.w); byId.set(p.id,p); });
  if(PROPS) PROPS.props.forEach(p=>{ if(p.pid) propIdx.set(p.pid+"|"+p.market, p); });

  const notes = [];
  if(DATA.demo) notes.push("<b>Demo stats.</b> Run the Update player logs workflow to load real nflverse stats.");
  else if(DATA.updated) notes.push(`Stats through <b>${DATA.updated}</b>`);
  if(PROPS) notes.push(`Lines as of <b>${new Date(PROPS.updated).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"})}</b>`);
  $("banner").innerHTML = notes.join(". "); $("banner").hidden = !notes.length;

  setupBoard();
  const last = store.get("pb_player");
  selectPlayer(byId.get(last) || DATA.players[0]);
  show(store.get("pb_view") || (PROPS ? "board" : "player"));
}

/* ---------- helpers ---------- */
const median = a => { if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const fmt = v => Number.isInteger(v) ? v : v.toFixed(1);
const toHalf = v => Math.floor(v) + 0.5;
const result = (v,line) => v>line ? "o" : v<line ? "u" : "p";
const am = p => p==null ? "—" : p>0 ? "+"+p : "−"+Math.abs(p);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function show(v){
  store.set("pb_view", v);
  $("board").hidden = v!=="board"; $("playerView").hidden = v!=="player";
  [...$("tabs").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===v));
  if(v==="player") render();
}

/* ---------- board ---------- */
function setupBoard(){
  const mk = PROPS ? [...new Set(PROPS.props.map(p=>p.market))] : [];
  $("bMarket").innerHTML = `<option value="">All markets</option>` + mk.map(k=>`<option value="${k}">${MARKETS[k]?.label||k}</option>`).join("");
  $("bGame").innerHTML = `<option value="">All games</option>` + (PROPS?PROPS.games:[]).map(g=>`<option>${esc(g.label)}</option>`).join("");
  renderBoard();
}
function hitL10(p){
  const pl = byId.get(p.pid); if(!pl || !MARKETS[p.market]) return null;
  const vals = pl.logs.slice(-10).map(MARKETS[p.market].get);
  return vals.length ? {o:vals.filter(v=>v>p.line).length, n:vals.length} : null;
}
function renderBoard(){
  if(!PROPS){ $("rows").innerHTML = `<div class="empty">No prop lines yet. Run the Update prop lines workflow in GitHub, then reload.</div>`; return; }
  let list = PROPS.props.filter(p => (!bst.market || p.market===bst.market) && (!bst.game || p.game===bst.game));
  list.forEach(p=>{ p._hit = hitL10(p); p._ev = p.value?.ev ?? -99; });
  const hitPct = p => p._hit ? p._hit.o/p._hit.n : -1;
  if(bst.sort==="value") list.sort((a,b)=>b._ev-a._ev || b.gap-a.gap);
  if(bst.sort==="gap")   list.sort((a,b)=>b.gap-a.gap || b._ev-a._ev);
  if(bst.sort==="hit")   list.sort((a,b)=>hitPct(b)-hitPct(a));
  if(!list.length){ $("rows").innerHTML = `<div class="empty">No props for this filter.</div>`; return; }

  $("rows").innerHTML = list.slice(0,150).map((p,i)=>{
    const o=p.bestOver, u=p.bestUnder, h=p._hit, tags=[];
    if(h){ const pct=h.o/h.n; tags.push(`<span class="tag ${pct>=.6?"g":pct<=.4?"r":""}">L10 over ${h.o}/${h.n}</span>`); }
    const v=p.value;
    if(v?.ev>0 && p.n>=2) tags.push(`<span class="tag g">${v.side==="over"?"Over":"Under"} ${am(v.price)} at ${esc(v.title)}: ${v.ev}% edge</span>`);
    if(p.gap>=1) tags.push(`<span class="tag y">Books differ by ${fmt(p.gap)}</span>`);
    tags.push(`<span class="tag">${p.books.length} book${p.books.length>1?"s":""}</span>`);
    return `<button class="row" data-i="${i}" ${p.pid&&byId.has(p.pid)?"":"disabled"}>
      <div class="r1"><span class="nm">${esc(p.name)}<small>${esc([p.pos,p.team].filter(Boolean).join(" "))}</small></span>
        <span class="mk">${MARKETS[p.market]?.label||p.market}<b>${fmt(p.line)}</b></span></div>
      <div class="r2">
        <span>Best over <b>${o?`${fmt(o.line)} ${am(o.price)}`:"—"}</b> ${o?esc(o.title):""}</span>
        <span>Best under <b>${u?`${fmt(u.line)} ${am(u.price)}`:"—"}</b> ${u?esc(u.title):""}</span>
      </div>
      <div class="tags">${tags.join("")}</div></button>`;
  }).join("");
  $("rows")._list = list;
}
$("bMarket").onchange = e => { bst.market=e.target.value; renderBoard(); };
$("bGame").onchange   = e => { bst.game=e.target.value; renderBoard(); };
$("bSort").onchange   = e => { bst.sort=e.target.value; renderBoard(); };
$("rows").onclick = e => {
  const b = e.target.closest("[data-i]"); if(!b || b.disabled) return;
  const p = $("rows")._list[+b.dataset.i];
  selectPlayer(byId.get(p.pid), p.market); show("player"); window.scrollTo(0,0);
};
$("tabs").onclick = e => { const b=e.target.closest("[data-v]"); if(b) show(b.dataset.v); };

/* ---------- player ---------- */
function games(){
  let g = player.logs;
  if(st.opp) g = g.filter(x=>x.o===st.opp);
  const cur = Math.max(...player.logs.map(x=>x.s));
  if(st.win==="l5") g = g.slice(-5);
  if(st.win==="l10") g = g.slice(-10);
  if(st.win==="season") g = g.filter(x=>x.s===cur);
  return g;
}
function selectPlayer(p, market){
  if(!p) return;
  player = p; store.set("pb_player", p.id);
  $("pname").textContent = p.name;
  $("pmeta").textContent = `${p.pos} ${p.team}`;
  const list = BY_POS[p.pos] || Object.keys(MARKETS);
  if(market && list.includes(market)) st.market = market;
  else if(!list.includes(st.market)) st.market = list[0];
  st.opp = "";
  $("markets").innerHTML = list.map(k=>`<button class="chip" data-m="${k}">${MARKETS[k].label}${propIdx.has(p.id+"|"+k)?" •":""}</button>`).join("");
  const opps = [...new Set(p.logs.map(x=>x.o))].sort();
  $("opp").innerHTML = `<option value="">All opponents</option>` + opps.map(o=>`<option>${o}</option>`).join("");
  resetLine(); render();
}
function resetLine(){
  const m = MARKETS[st.market], prop = propIdx.get(player.id+"|"+st.market);
  if(m.fixed!=null){ st.line = m.fixed; return; }
  if(prop){ st.line = prop.line; return; }
  st.line = toHalf(median(player.logs.slice(-10).map(m.get)));
}
function render(){
  if(!player) return;
  const m = MARKETS[st.market], fixed = m.fixed!=null;
  $("line").value = fmt(st.line);
  $("line").readOnly = fixed; $("minus").disabled = fixed || st.line<=0.5; $("plus").disabled = fixed;
  $("windows").innerHTML = WINDOWS.map(([k,l])=>`<button data-w="${k}" aria-pressed="${k===st.win}">${l}</button>`).join("");
  $("opp").value = st.opp;
  [...$("markets").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===st.market));

  const prop = propIdx.get(player.id+"|"+st.market);
  $("books").hidden = !prop;
  if(prop){
    $("books").innerHTML = `<button class="hd" tabindex="-1"><span>${esc(prop.game)}</span><span>Line</span><span>Over</span><span>Under</span></button>` +
      prop.books.map(b=>`<button data-l="${b.line}" class="${b.line===st.line?"on":""}"><span>${esc(b.title)}</span><span>${fmt(b.line)}</span><span>${am(b.over)}</span><span>${am(b.under)}</span></button>`).join("");
  }

  const g = games(), vals = g.map(m.get);
  if(!g.length){
    $("chart").innerHTML = `<div class="empty">No games match. Pick a wider window or another opponent.</div>`;
    ["avg","med","hi","lo"].forEach(id=>$(id).textContent="—");
    $("hit").innerHTML="—"; $("log").innerHTML=""; return;
  }
  const overs = vals.filter(v=>v>st.line).length, pct = Math.round(overs/vals.length*100);
  $("hit").innerHTML = `${overs}/${vals.length}<small>${pct}%</small>`;
  $("hit").style.color = pct>=60 ? "var(--over)" : pct<=40 ? "var(--under)" : "var(--text)";
  $("avg").textContent = fmt(Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10);
  $("med").textContent = fmt(median(vals));
  $("hi").textContent = Math.max(...vals); $("lo").textContent = Math.min(...vals);
  drawChart(g, vals); drawLog(g, m);
}
function drawChart(g, vals){
  const H=210, top=22, bottom=40, bw=30, gap=12, pad=16;
  const W = Math.max($("chartScroll").clientWidth || 320, pad*2 + g.length*(bw+gap) - gap);
  const step = g.length>1 ? Math.min(bw+gap, (W-pad*2-bw)/(g.length-1)) : 0;
  const x0 = g.length>1 ? pad : W/2 - bw/2;
  const max = Math.max(...vals, st.line, 1) * 1.12;
  const y = v => top + (H-top-bottom) * (1 - v/max);
  const base = H-bottom, ly = y(st.line);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Game log bar chart">`;
  g.forEach((gm,i)=>{
    const v = vals[i], x = x0 + i*step, r = result(v,st.line);
    const col = r==="o"?"var(--over)":r==="u"?"var(--under)":"var(--push)";
    const h = Math.max(2, base - y(v));
    s += `<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="4" fill="${col}"/>`;
    s += `<text x="${x+bw/2}" y="${base-h-6}" text-anchor="middle" fill="var(--text)" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="600" font-size="14">${v}</text>`;
    s += `<text x="${x+bw/2}" y="${base+16}" text-anchor="middle" fill="var(--muted)" font-size="11">${gm.o}</text>`;
    s += `<text x="${x+bw/2}" y="${base+30}" text-anchor="middle" fill="var(--muted)" font-size="10">${String(gm.s).slice(2)} W${gm.w}</text>`;
  });
  s += `<line x1="${pad/2}" x2="${W-pad/2}" y1="${ly}" y2="${ly}" stroke="var(--post)" stroke-width="2" stroke-dasharray="6 4"/></svg>`;
  $("chart").innerHTML = s;
  $("chartScroll").scrollLeft = 1e6;
}
function drawLog(g, m){
  const pos = player.pos;
  const cols = pos==="QB"
    ? [["Att",x=>x.pa],["Pass yds",x=>x.py],["TD",x=>x.ptd],["Rush",x=>x.ry]]
    : pos==="RB"
    ? [["Car",x=>x.ca],["Rush yds",x=>x.ry],["Rec",x=>x.rec],["Rec yds",x=>x.rey],["TD",x=>x.rtd+x.retd]]
    : [["Tgt",x=>x.tgt],["Rec",x=>x.rec],["Yds",x=>x.rey],["TD",x=>x.retd]];
  let h = `<tr><th>Game</th>${cols.map(c=>`<th>${c[0]}</th>`).join("")}<th>${m.label}</th></tr>`;
  [...g].reverse().forEach(x=>{
    const v = m.get(x);
    h += `<tr><td>${x.s} W${x.w} vs ${x.o}</td>${cols.map(c=>`<td>${c[1](x)}</td>`).join("")}<td class="${result(v,st.line)}">${v}</td></tr>`;
  });
  $("log").innerHTML = h;
}

/* ---------- player events ---------- */
$("markets").onclick = e => { const b=e.target.closest("[data-m]"); if(!b) return; st.market=b.dataset.m; resetLine(); render(); };
$("windows").onclick = e => { const b=e.target.closest("[data-w]"); if(!b) return; st.win=b.dataset.w; render(); };
$("books").onclick = e => { const b=e.target.closest("[data-l]"); if(!b || MARKETS[st.market].fixed!=null) return; st.line=+b.dataset.l; render(); };
$("opp").onchange = e => { st.opp=e.target.value; render(); };
$("minus").onclick = () => { st.line=Math.max(0.5,st.line-1); render(); };
$("plus").onclick  = () => { st.line+=1; render(); };
$("line").onchange = e => { const v=parseFloat(e.target.value); if(!isNaN(v)&&v>=0) st.line=v; render(); };

const q=$("q"), res=$("results");
q.oninput = () => {
  const t = q.value.trim().toLowerCase();
  if(!t){ res.classList.remove("open"); return; }
  const hits = DATA.players.filter(p=>p.name.toLowerCase().includes(t)).slice(0,25);
  res.innerHTML = hits.length
    ? hits.map(p=>`<button data-id="${p.id}" role="option"><span>${esc(p.name)}</span><small>${p.pos} ${p.team}</small></button>`).join("")
    : `<div class="empty" style="padding:14px">No player named “${esc(q.value)}”</div>`;
  res.classList.add("open");
};
res.onclick = e => { const b=e.target.closest("[data-id]"); if(!b) return;
  selectPlayer(byId.get(b.dataset.id)); q.value=""; res.classList.remove("open"); q.blur(); };
document.addEventListener("click", e => { if(!e.target.closest(".search")) res.classList.remove("open"); });
window.addEventListener("resize", () => !$("playerView").hidden && render());

load();
</script>
