name: Update prop lines
on:
  schedule:
    # Times are UTC. Odd minutes on purpose: GitHub starts runs scheduled on the hour late (1-3 hrs) when it's busy.
    - cron: "41 13 * * *"   # every day, 9:41 AM Eastern (8:41 after Nov 1)
    - cron: "47 21 * * *"   # every day, 5:47 PM Eastern (4:47 after Nov 1)
    - cron: "37 14 * * 0"   # Sundays, 10:37 AM Eastern (9:37 after Nov 1)
    - cron: "43 15 * * 0"   # Sundays, 11:43 AM Eastern: injury news and inactives (10:43 after Nov 1)
    - cron: "23 16 * * 0"   # Sundays, 12:23 PM Eastern, last look before 1 PM kickoffs (11:23 after Nov 1)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install propline
      - run: python build_props.py
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add props.json
          git commit -m "Update prop lines" || echo "No changes"
          git pull --rebase
          git push
