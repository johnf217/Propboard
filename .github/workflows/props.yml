name: Update prop lines
on:
  schedule:
    - cron: "0 14 * * *"    # every day, 10 AM Eastern
    - cron: "0 22 * * *"    # every day, 6 PM Eastern
    - cron: "15 16 * * 0"   # Sundays, 12:15 PM Eastern (right before 1 PM kickoffs)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install propline
      - run: python build_props.py
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add props.json
          git commit -m "Update prop lines" || echo "No changes"
          git pull --rebase
          git push
