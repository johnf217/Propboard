name: Update usage

on:
  workflow_run:
    workflows: ["Update player logs"]
    types: [completed]
  schedule:
    - cron: "0 15 * * 2,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_usage.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add usage.json
          git diff --staged --quiet || (git commit -m "Update usage" && git pull --rebase && git push)
