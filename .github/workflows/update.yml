name: Update player logs
on:
  schedule:
    - cron: "0 12 * * 2"   # every Tuesday morning
  workflow_dispatch:        # adds a manual "Run workflow" button
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas nflreadpy pyarrow
      - run: python build_logs.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add player_logs.json
          git commit -m "Update player logs" || echo "No changes"
          git push
