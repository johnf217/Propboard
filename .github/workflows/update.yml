name: Update player logs
on:
  schedule:
    - cron: "23 11 * * 2"  # Tuesdays, 7:23 AM Eastern (odd minute so GitHub starts it on time)
    - cron: "41 15 * * 2"  # Tuesdays, 11:41 AM Eastern: backup in case GitHub skipped the first one
    - cron: "41 11 * * 3"  # Wednesdays, 7:41 AM Eastern: second backup (also picks up stat corrections)
  workflow_dispatch:        # adds a manual "Run workflow" button
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas nflreadpy pyarrow
      - run: python build_logs.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add player_logs.json
          git commit -m "Update player logs" || echo "No changes"
          git pull --rebase
          git push
