name: Update game context

on:
  workflow_run:
    workflows: ["Update prop lines"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install propline
      - run: python build_context.py
        continue-on-error: true
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      - run: python build_injuries.py
        continue-on-error: true
      - run: python build_lines.py
        continue-on-error: true
      - name: Save model picks
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python snapshot_picks.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add context.json || true
          git add injuries.json || true
          git add picks.json || true
          git add lines.json || true
          git diff --staged --quiet || (git commit -m "Update context, injuries and picks" && git pull --rebase && git push)
